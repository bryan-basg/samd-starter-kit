# Dependabot — vigila dependencias vulnerables y propone updates (seguridad por diseño).
#
# Cinco ecosistemas activos: github-actions (workflows), npm (frontend/), pip (requirements*.txt
# de la raíz), docker (Dockerfile) y devcontainers (.devcontainer/). Si quitás un manifiesto, comentá su bloque: Dependabot falla si no lo encuentra.
#
# TODOS los bloques llevan la etiqueta `dependencies` a propósito: `stale.yml` exime de cierre
# automático a los PRs con esa etiqueta (`exempt-pr-labels`). Cerrar un PR de Dependabot le
# dice «esta versión no la quiero» y no vuelve a proponerla; una actualización de una pieza
# externa (IEC 62304 §8) no puede perderse en silencio por inactividad. No existe una etiqueta
# `security` en el repo (Dependabot no la crea), por eso no se usa.
#
# `cooldown` (14 días, en todos los bloques): Dependabot espera ese tiempo desde que se publica
# una versión antes de proponerla. Una versión recién publicada es justo la que puede traer un
# paquete comprometido (cadena de suministro, IEC 62304 §8); dos semanas bastan para que la
# comunidad lo detecte y lo retire. El cooldown frena SOLO las actualizaciones de VERSIÓN: los
# avisos de SEGURIDAD (CVE) llegan igual y de inmediato, así que un parche urgente no se demora.
# Si querés ir más rápido en un ecosistema concreto, bajá el número ahí; no lo quites.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # Versiones MAYORES con un bloqueo duro hoy. Se ignoran con su motivo para que Dependabot
    # no abra PRs que no se pueden fusionar ni deje una corrida roja cada semana. Los avisos de
    # SEGURIDAD siguen llegando igual: `update-types` solo frena las actualizaciones de VERSIÓN
    # (no agregar `versions:` a estas reglas, porque esa clave sí alcanzaría a las de seguridad).
    #  - typescript: @typescript-eslint 8 declara `typescript <6.1`; Dependabot no puede
    #    resolver ese choque de dependencias de pares y la corrida de npm quedaba en rojo.
    #  - @types/node: los tipos deben seguir el major de Node que el proyecto USA (24: CI,
    #    deploy, docker-compose y devcontainer), no el último que exista; un @types/node más
    #    nuevo que el runtime deja pasar APIs que en producción no están.
    # Condición para quitar `typescript`: un @typescript-eslint que acepte la versión nueva.
    # Condición para quitar `@types/node`: subir Node a ese major en los mismos cuatro sitios.
    # vitest, jsdom y @testing-library/jest-dom estuvieron aquí mientras el proyecto usaba
    # Node 20 (sus majors nuevos exigen Node 22+; npm solo AVISA y sus PRs salían verdes sin
    # haber probado nada); con Node 24 ya se proponen, y el CI los prueba de verdad.
    # eslint 10 NO se ignora: es deuda real y su PR en rojo es la señal visible.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # react, react-dom y sus tipos se actualizan SIEMPRE juntos: cada uno declara como
    # dependencia de pares a los otros, así que subir uno solo hace fallar `npm ci` (ERESOLVE).
    # Con PRs separados (como pasó con react 19: #33 y #34) ninguno puede quedar verde.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # mutmut va FIJADO a 2.5.1 (`requirements-dev.txt`): mutmut 3 eliminó `--paths-to-mutate` y
    # `--runner`, que usa `scripts/run_mutmut.sh`, y cambió el cache que lee
    # `scripts/check_mutmut_score.py`. Si Dependabot lo subiera solo, la mutación backend
    # quedaría rota sin aviso. Condición para quitar la regla: migrar ambos scripts a mutmut 3.
    ignore:
      - dependency-name: "mutmut"
        update-types: ["version-update:semver-major"]
      # schemathesis va FIJADO a propósito (`requirements-fuzz.txt`): sin fijar, el gate del fuzz
      # cambió de criterio entre dos corridas sin que cambiara el código. Subirlo es una decisión
      # deliberada (cambiar el número, correr el fuzz y leer el reporte en el MISMO PR). Se ignoran
      # las tres clases de actualización de VERSIÓN; los avisos de SEGURIDAD (CVE) llegan igual.
      # Condición para quitar la regla: que el gate del fuzz tolere cambios de versión de la herramienta.
      - dependency-name: "schemathesis"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  # Imágenes base del Dockerfile (python:3.12-slim). NO cubre las imágenes de `container:` /
  # `services:` de los workflows (semgrep, pgvector): Dependabot no las lee; esas van pineadas por
  # digest a mano (guardián: tests/test_workflows_pineados_a_sha.py).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies"]
  # Features del devcontainer (`.devcontainer/devcontainer-lock.json`, con digest resuelto).
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    labels: ["dependencies", "ci"]
