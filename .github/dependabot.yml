# Dependabot — vigila dependencias vulnerables y propone updates (seguridad por diseño).
#
# Tres ecosistemas activos: github-actions (workflows), npm (frontend/) y pip (requirements*.txt
# de la raíz). Si quitás un manifiesto, comentá su bloque: Dependabot falla si no lo encuentra.
#
# TODOS los bloques llevan la etiqueta `dependencies` a propósito: `stale.yml` exime de cierre
# automático a los PRs con esa etiqueta (`exempt-pr-labels`). Cerrar un PR de Dependabot le
# dice «esta versión no la quiero» y no vuelve a proponerla; una actualización de una pieza
# externa (IEC 62304 §8) no puede perderse en silencio por inactividad. No existe una etiqueta
# `security` en el repo (Dependabot no la crea), por eso no se usa.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # Versiones MAYORES con un bloqueo duro hoy. Se ignoran con su motivo para que Dependabot
    # no abra PRs que no se pueden fusionar ni deje una corrida roja cada semana. Los avisos de
    # SEGURIDAD siguen llegando igual: `update-types` solo frena las actualizaciones de VERSIÓN
    # (no agregar `versions:` a estas reglas, porque esa clave sí alcanzaría a las de seguridad).
    #  - typescript: @typescript-eslint 8 declara `typescript <6.1`; Dependabot no puede
    #    resolver ese choque de dependencias de pares y la corrida de npm quedaba en rojo.
    #  - @types/node: los tipos deben seguir el major de Node que el proyecto USA (24: CI,
    #    deploy, docker-compose y devcontainer), no el último que exista; un @types/node más
    #    nuevo que el runtime deja pasar APIs que en producción no están.
    # Condición para quitar `typescript`: un @typescript-eslint que acepte la versión nueva.
    # Condición para quitar `@types/node`: subir Node a ese major en los mismos cuatro sitios.
    # vitest, jsdom y @testing-library/jest-dom estuvieron aquí mientras el proyecto usaba
    # Node 20 (sus majors nuevos exigen Node 22+; npm solo AVISA y sus PRs salían verdes sin
    # haber probado nada); con Node 24 ya se proponen, y el CI los prueba de verdad.
    # eslint 10 NO se ignora: es deuda real y su PR en rojo es la señal visible.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # react, react-dom y sus tipos se actualizan SIEMPRE juntos: cada uno declara como
    # dependencia de pares a los otros, así que subir uno solo hace fallar `npm ci` (ERESOLVE).
    # Con PRs separados (como pasó con react 19: #33 y #34) ninguno puede quedar verde.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
