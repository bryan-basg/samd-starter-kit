<!doctype html>
<!--
  FUENTE de las portadas del README (1280x640): social-preview.png (claro) y
  social-preview-dark.png (oscuro). Edita ESTE archivo y regenera las dos:

    google-chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1280,640 --screenshot=.github/social-preview.png \
      "file://$PWD/.github/social-preview.src.html"
    google-chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1280,640 --screenshot=.github/social-preview-dark.png \
      "file://$PWD/.github/social-preview.src.html#dark"

  Sin cifras a propósito: envejecen. El símbolo es docs/assets/logo.svg.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SaMD Starter Kit — social preview</title>
<style>
  :root { --bg: #ffffff; --ink: #0f172a; --muted: #475569; }
  body.dark { --bg: #0b1120; --ink: #f1f5f9; --muted: #a3b1c2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { font-family: "Liberation Sans", Arial, Helvetica, sans-serif; color: var(--ink); background: var(--bg); display: flex; align-items: center; justify-content: center; gap: 72px; }
  .logo { width: 340px; height: 340px; flex: none; }
  h1 { font-size: 112px; line-height: 104px; font-weight: 800; letter-spacing: -4.5px; }
  p { margin-top: 24px; font-size: 32px; color: var(--muted); }
</style>
</head>
<body>
<script>if (location.hash === "#dark") document.body.classList.add("dark");</script>
<svg class="logo" viewBox="0 0 128 128" aria-hidden="true">
  <linearGradient id="marca" gradientUnits="userSpaceOnUse" x1="14" y1="112" x2="114" y2="16"><stop offset="0" stop-color="#00C4C9"/><stop offset=".5" stop-color="#1F6FC6"/><stop offset="1" stop-color="#8A4FE0"/></linearGradient>
  <mask id="prompt"><rect width="128" height="128" fill="#fff"/><path d="M55.5 55l9.5 9-9.5 9M67.5 74h6" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></mask>
  <g fill="url(#marca)"><rect x="46" y="6" width="36" height="36" rx="9"/><rect x="6" y="46" width="36" height="36" rx="9"/><rect x="86" y="46" width="36" height="36" rx="9"/><rect x="46" y="46" width="36" height="36" rx="9" mask="url(#prompt)"/></g>
  <rect x="49" y="89" width="30" height="30" rx="6.5" fill="none" stroke="url(#marca)" stroke-width="6"/>
</svg>
<div><h1>SaMD<br>Starter Kit</h1><p>Software as a Medical Device</p></div>
</body>
</html>
