# CI de referencia para un SaMD.
# Stack de referencia: frontend React + TypeScript + Vite + vitest; backend Python + FastAPI + pytest.
#
# Los jobs de app (frontend / backend / contrato) corren sobre el esqueleto ejecutable
# que trae el kit (`app/`, `frontend/`, `tests/`) y usan paths-filter para no correr
# backend si solo cambió el frontend (y viceversa).
#
# Si adaptás el kit a otro stack, ajustá los filtros y los comandos de cada job a tu
# estructura real. Lo que NO es negociable es que existan: un CI que solo valida los
# enlaces de la documentación deja pasar cualquier regresión de código con el badge
# en verde — y en un SaMD la verificación demostrable (IEC 62304 §5.7) es el producto.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Gate SaMD: integridad de la trazabilidad documental (siempre corre, barato) ----
  trace-integrity:
    name: Trazabilidad documental (enlaces cross-doc)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Link-checker cross-doc (0 broken obligatorio)
        run: bash scripts/check_doc_links.sh

  # ---- Reparto: qué capas tocó el cambio (evita correr backend si solo cambió UI) ----
  changes:
    name: Qué capas cambiaron
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              # El propio workflow: si cambia el CI, corren TODOS los jobs. Sin esto,
              # un PR que toca solo el CI no ejecuta nada y se mergea sin haberse
              # probado a sí mismo.
              - '.github/workflows/ci.yml'
            backend:
              - 'app/**'
              - 'tests/**'
              - 'requirements*.txt'
              # `scripts/` son Python y entran en el type-check estricto (`mypy .`):
              # sin esta línea, tocar un script no dispara nada y el gate da verde
              # sin haber mirado el archivo que cambió.
              - 'scripts/**/*.py'
              - 'pyproject.toml'
              - 'pytest.ini'
              - '.mypy.ini'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (lint + tipos + tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run

  backend:
    name: Backend (imports muertos + tipos + tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTING: "True"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Imports muertos (no detectar a ojo)
        run: ruff check app/ --select F401,F841,F811
      - name: Type-check estricto
        run: mypy .
      - name: Tests
        run: TESTING=True DATABASE_URL="sqlite+aiosqlite:///:memory:" pytest -q

  contract-sync:
    name: Drift del contrato OpenAPI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - name: Drift del contrato
        run: |
          python scripts/export_openapi.py --out /tmp/openapi.json
          git diff --no-index --exit-code frontend/src/api/openapi.json /tmp/openapi.json \
            || (echo "::error::El contrato OpenAPI cambió pero no se regeneraron los tipos del frontend" && exit 1)
