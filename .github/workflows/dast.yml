name: DAST (OWASP ZAP)

# DAST — OWASP ZAP baseline contra la app CORRIENDO en local.
# Complementa SAST (semgrep) + SCA (trivy) + fuzz de contrato (schemathesis) con
# un escaneo DINÁMICO de la app viva (XSS, inyección, headers/cookies inseguras,
# fugas). Crítico en un SaMD que maneja datos de salud (HIPAA / GDPR Art.32).
#
#   Proyecto:   {{PROJECT_NAME}}
#   Clase SaMD: {{SAMD_CLASS}}
#   Backend:    {{BACKEND_STACK}}
#
# Sin secretos → runner barato. Nightly + manual. NUNCA apunta a producción:
# un scan activo contra prod requiere OK explícito y otro workflow.
#
# Optimizaciones obligatorias: concurrency, timeout duro, acciones pineadas,
# retención acotada de artifacts.

on:
  # ACTIVOS: el script levanta el backend en el runner, así que no hace falta nada
  # desplegado. Antes de encenderlo daba un VERDE FALSO — escaneaba la raíz `/`,
  # que en una API no existe, y aprobaba habiendo mirado tres 404. Ahora el script
  # exige que el objetivo responda 200 antes de escanear y que el reporte exista
  # después; sin eso el gate no aprueba.
  schedule:
    - cron: '0 6 * * 1'   # lunes 06:00 UTC
  push:
    paths:
      - 'app/**'
      - 'scripts/run_zap_dast.sh'
      - '.github/workflows/dast.yml'
  workflow_dispatch:

concurrency:
  group: dast-${{ github.ref }}
  # Un cron cancelado pierde la ÚNICA muestra del día Y queda como `cancelled`, que no se lee como rojo
  # (.claude/rules/github-actions.md §Los rojos que NO se ven). Solo se cancelan las corridas de push/PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline (backend local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run ZAP baseline DAST
        # El script levanta el backend (SQLite, sin servicios externos), espera
        # /health y corre ZAP contra él. El gate refleja FAILs reales (no WARN).
        run: bash scripts/run_zap_dast.sh

      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-dast-report
          path: |
            reports/dast/zap_dast_report.html
            reports/dast/zap_dast_report.json
            reports/dast/dast_backend.log
          retention-days: 14
          if-no-files-found: ignore
