# Construye el sitio de documentación (MkDocs Material) y lo publica en GitHub Pages.
#
#   · build con `mkdocs build --strict`: cualquier warning (enlace roto, página fuera
#     del nav, anchor inexistente) ABORTA el deploy — mismo rigor de trazabilidad que
#     el resto del CI (IEC 62304 §5.7: verificación demostrable antes de publicar).
#   · publica con las actions oficiales de Pages (artifact + deploy-pages), sin tokens
#     custom ni `gh-deploy` empujando a una rama.
#
# REQUISITO MANUAL (una sola vez): Settings → Pages → Build and deployment →
# Source = "GitHub Actions". Sin eso, el job `deploy` falla al no encontrar Pages activo.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  # En PR solo se VERIFICA (build --strict); `configure-pages`, la subida y `deploy` se saltean.
  # Sin `paths:` el filtro del push no aplica: se repite para no correr en PRs ajenos a docs.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

# Permisos mínimos para desplegar a Pages vía OIDC (id-token) — nada de contents:write.
permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no cancelar un deploy a Pages a medias.
# En PR cada rama tiene su grupo y se cancela la corrida vieja; el push a main conserva el grupo
# `pages` (serializa los deploys y no cancela uno a medias).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build del sitio (mkdocs build --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias del sitio
        run: pip install -r requirements-docs.txt
      - name: Build estricto (warnings = error)
        run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        # enablement: true => el workflow intenta ACTIVAR Pages por sí mismo en
        # el primer run, en vez de fallar con "Get Pages site failed / Not Found".
        # Hace el kit a prueba de balas en proyectos derivados recién clonados.
        # (Requiere permiso `pages: write`, ya declarado en este workflow.)
        with:
          enablement: true
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'   # en PR solo se verifica el build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
