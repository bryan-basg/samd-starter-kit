# Auditoría de seguridad SaMD — Trivy (CVEs) + Semgrep (SAST).
# Nightly + en PRs que tocan código o dependencias. Gate: bloquea HIGH/CRITICAL sin waiver.
name: Security Audit

on:
  # ACTIVOS: el esqueleto del kit es código real y este gate lo escanea de verdad.
  # En su primera corrida encontró el Dockerfile corriendo como root (DS-0002, HIGH).
  # Si adaptás el kit a otro stack, ajustá los paths; no los comentes.
  schedule:
    - cron: '0 3 * * *'   # nightly 03:00 UTC
  pull_request:
    paths:
      - 'app/**'
      - 'frontend/src/**'
      - 'requirements*.txt'
      - 'frontend/package*.json'
      - 'Dockerfile'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  # Un cron cancelado pierde la ÚNICA muestra del día Y queda como `cancelled`, que no se lee como rojo
  # (.claude/rules/github-actions.md §Los rojos que NO se ven). Solo se cancelan las corridas de push/PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  trivy:
    name: Trivy (CVEs deps + misconfig + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: true

  semgrep:
    name: Semgrep (SAST Python + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep --config auto --error --severity ERROR app/ frontend/src/
