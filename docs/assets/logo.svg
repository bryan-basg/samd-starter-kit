<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SaMD Starter Kit">
  <!-- Cruz de salud armada con módulos de software: las piezas del kit, una terminal al centro y
       el hueco de la pieza que falta (tu app). Degradado de marca en todo el símbolo, sin recolorear. -->
  <linearGradient id="marca" gradientUnits="userSpaceOnUse" x1="14" y1="112" x2="114" y2="16"><stop offset="0" stop-color="#00C4C9"/><stop offset=".5" stop-color="#1F6FC6"/><stop offset="1" stop-color="#8A4FE0"/></linearGradient>
  <mask id="prompt"><rect width="128" height="128" fill="#fff"/><path d="M55.5 55l9.5 9-9.5 9M67.5 74h6" fill="none" stroke="#000" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></mask>
  <g fill="url(#marca)"><rect x="46" y="6" width="36" height="36" rx="9"/><rect x="6" y="46" width="36" height="36" rx="9"/><rect x="86" y="46" width="36" height="36" rx="9"/><rect x="46" y="46" width="36" height="36" rx="9" mask="url(#prompt)"/></g>
  <rect x="49" y="89" width="30" height="30" rx="6.5" fill="none" stroke="url(#marca)" stroke-width="6"/>
</svg>
